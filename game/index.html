<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Palmera Bay — an original open-world crime game. Rico Vega owes the fixer Marla Quinn $5,000. Explore a coastal city on foot and by car, steal cars, outrun the police, and work off the debt across three story missions.">
<title>Palmera Bay — an open-world crime story</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0a0e14; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<noscript><p style="color:#fff;font:16px system-ui,sans-serif;padding:2em">Palmera Bay needs JavaScript to run — please enable it and reload.</p></noscript>
<canvas id="game" aria-label="Palmera Bay: an open-world crime game. Explore the city on foot or by car, take jobs, and outrun the police."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
